[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path configuration
# Add current directory (backend) to Python path so imports like 'from src.main import app' work
pythonpath = .

# Asyncio configuration
asyncio_mode = auto

# Test markers
markers =
    unit: Unit tests that test individual functions in isolation with mocks
    integration: Integration tests that test multiple components together

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

